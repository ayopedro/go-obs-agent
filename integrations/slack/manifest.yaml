display_information:
  name: Observability Agent
  description: Investigate traces, metrics, and logs
  background_color: "#16324f"
features:
  bot_user:
    display_name: Observability Agent
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
settings:
  event_subscriptions:
    request_url: https://YOUR_PUBLIC_HOST/slack/events
    bot_events:
      - app_mention
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
